<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Villa Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Villa Manager: a side menu of sections (home, calendar, bookings, prices, reviews, team, money, settings) and one
   content column. Same paper palette as the Kantor page. All content is built by villa-app.js. */
:root{
  --bg:#EFE8DC; --panel:#F8F4EC; --card:#FFFFFF; --line:#DDD2C1; --fg:#2E2B28; --muted:#675E55;
  --alert:#C2502E; --ok:#5F8048; --bell:#A87A12; --sky:#5B86A8; --ink:#2E2B28; --plum:#8A6A9A;
  --s-in:#2a78d6; --s-out:#eb6834;
  --f-display:'Zen Maru Gothic', ui-rounded, system-ui, sans-serif;
  --f-body:'Zen Kaku Gothic New', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1F1C19; --panel:#26221E; --card:#2E2924; --line:#40392F; --fg:#F1EADF; --muted:#B8AC9C; --ink:#F1EADF;
  --alert:#E2704C; --ok:#9DB88A; --bell:#E0B04A; --sky:#8FB4D2; --plum:#B99ACB; --s-in:#3987e5; --s-out:#d95926; color-scheme:dark}}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
a{color:inherit}
h1,h2{margin:0;font-family:var(--f-display)} h1{font-size:clamp(20px,2.6vw,26px)} h2{font-size:17px}
h3{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:12.5px} .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100dvh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100dvh;overflow-y:auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;padding:0 8px}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.side label{padding:0 4px}
nav.menu{display:grid;gap:2px}
nav.menu button{display:flex;align-items:center;justify-content:flex-start;gap:10px;width:100%;border:0;background:none;color:var(--fg);font:inherit;font-weight:500;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer;min-height:42px}
nav.menu button:hover{background:color-mix(in srgb, var(--line) 45%, transparent)}
nav.menu button[aria-current="page"]{background:var(--ink);color:var(--bg);font-weight:700}
nav.menu svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.menu .count{margin-left:auto;background:var(--alert);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.side .foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:0 8px;display:grid;gap:4px}
.main{padding:18px max(18px, env(safe-area-inset-right, 0px)) 48px 18px;display:flex;flex-direction:column;gap:16px;min-width:0;max-width:1320px;width:100%}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.topbar .left{display:flex;align-items:center;gap:10px;min-width:0}
#burger{display:none}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav b{font-family:var(--f-display);font-size:16px;min-width:138px;text-align:center}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:30;left:0;top:0;width:260px;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .side.open{transform:none}
  #burger{display:inline-flex}
  .main{padding:14px 16px 48px}
  #scrim{position:fixed;inset:0;background:rgba(30,25,20,.4);z-index:20}
}
@media (prefers-reduced-motion: reduce){.side{transition:none}}

/* pieces */
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,.btn:hover{border-color:var(--muted)}
button.pri,.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
button.danger{color:var(--alert)}
button.mini,.btn.mini{min-height:32px;padding:4px 10px;font-size:12.5px}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.box.warn{border-color:var(--alert);background:color-mix(in srgb, var(--alert) 8%, var(--card))}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
ul.plain{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ul.plain > li{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--card)}
.tag.in{border-color:var(--ok);color:var(--ok)} .tag.out{border-color:var(--alert);color:var(--alert)} .tag.house{border-color:var(--sky);color:var(--sky)}
.tag.soon{border-color:var(--bell);color:var(--bell)} .tag.good{background:color-mix(in srgb, var(--ok) 16%, var(--card));border-color:var(--ok);color:var(--fg)}
.tag.bad{background:color-mix(in srgb, var(--alert) 14%, var(--card));border-color:var(--alert);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border-radius:999px;min-height:34px;padding:4px 12px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.vcard{text-align:left;align-items:stretch;flex-direction:column;gap:6px;padding:14px;border-radius:14px;justify-content:flex-start;min-height:0}
.vcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.vcard b{font-family:var(--f-display);font-size:17px}
.meter{height:10px;border-radius:999px;background:color-mix(in srgb, var(--line) 60%, transparent);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--s-in);min-width:2px}
.meter.done i{background:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:color-mix(in srgb, var(--sky) 10%, transparent)}
.tscroll{overflow-x:auto}

/* timeline calendar */
.cal-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.cal{display:grid;font-size:11.5px;min-width:max-content}
.cal .h{padding:4px 0;text-align:center;color:var(--muted);border:0;border-bottom:1px solid var(--line);line-height:1.25;cursor:pointer;background:none;border-radius:0;min-height:0;display:block}
.cal .h.we{background:color-mix(in srgb, var(--line) 35%, transparent)}
.cal .h.today{color:var(--fg);font-weight:700;background:color-mix(in srgb, var(--bell) 22%, transparent)}
.cal .h.sel{box-shadow:inset 0 -3px 0 var(--ink)}
.cal .h small{display:block;font-size:10px;height:13px;color:var(--fg);font-weight:700}
.cal .u{position:sticky;left:0;z-index:3;background:var(--card);padding:0 10px;display:flex;align-items:center;font-weight:700;font-family:var(--f-display);border-right:1px solid var(--line);white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis;cursor:default}
.cal .cell{border-left:1px solid color-mix(in srgb, var(--line) 50%, transparent);border-top:1px solid color-mix(in srgb, var(--line) 50%, transparent);height:46px;cursor:pointer}
.cal .cell:hover{background:color-mix(in srgb, var(--sky) 14%, transparent)}
.cal .cell.today{background:color-mix(in srgb, var(--bell) 12%, transparent)}
.cal .cell.sel{background:color-mix(in srgb, var(--ink) 8%, transparent)}
.cal .ev{z-index:1;margin:7px 2px;border-radius:7px;padding:0 7px;display:block;line-height:30px;font:inherit;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:0;text-align:left;width:0;min-width:calc(100% - 4px);
  background:color-mix(in srgb, var(--ok) 28%, var(--card));border:1px solid color-mix(in srgb, var(--ok) 65%, var(--line));color:var(--fg)}
.cal .ev.ota{background:color-mix(in srgb, var(--sky) 30%, var(--card));border-color:color-mix(in srgb, var(--sky) 70%, var(--line))}
.cal .ev.closed{background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--muted) 16%, var(--card)) 0 6px, var(--card) 6px 12px);border-color:var(--line);color:var(--muted)}
.cal .ev.pribadi{background:color-mix(in srgb, var(--bell) 30%, var(--card));border-color:color-mix(in srgb, var(--bell) 70%, var(--line))}
.cal .ev.acara{background:color-mix(in srgb, var(--plum) 30%, var(--card));border-color:color-mix(in srgb, var(--plum) 70%, var(--line))}
.cal .ev.maintenance{background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--alert) 26%, var(--card)) 0 6px, color-mix(in srgb, var(--alert) 12%, var(--card)) 6px 12px);border-color:color-mix(in srgb, var(--alert) 60%, var(--line))}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}

/* price calendar */
.pcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pcal .dow{font-size:11.5px;color:var(--muted);text-align:center;padding:2px 0}
.pcal .d{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:66px;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.pcal .d b{font-variant-numeric:tabular-nums;font-size:13.5px}
.pcal .d small{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcal .d.low{border-bottom:3px solid var(--sky)} .pcal .d.high{border-bottom:3px solid var(--bell)} .pcal .d.peak{border-bottom:3px solid var(--alert)}
.pcal .d.busy{background:color-mix(in srgb, var(--ok) 14%, var(--card))}
.pcal .d.today{box-shadow:inset 0 0 0 2px var(--ink)}
@media (max-width:560px){.pcal .d{padding:4px;min-height:58px}.pcal .d b{font-size:11.5px}}

/* chart */
.chart{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;height:190px;align-items:end;border-bottom:1px solid var(--line);padding-top:18px}
.chart .grp{display:flex;gap:2px;align-items:flex-end;justify-content:center;height:100%;border:0;background:none;padding:0;border-radius:0;min-height:0}
.chart .grp:hover,.chart .grp:focus-visible{background:color-mix(in srgb, var(--line) 40%, transparent)}
.chart .grp i{display:block;width:38%;max-width:22px;border-radius:4px 4px 0 0;min-height:1px}
.chart .grp i.in{background:var(--s-in)} .chart .grp i.out{background:var(--s-out)}
.chart .top{position:absolute;left:0;top:0;font-size:11px;color:var(--muted)}
.xlab{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;font-size:11px;color:var(--muted);text-align:center}
.xlab .cur{color:var(--fg);font-weight:700}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.15);white-space:nowrap;top:0}
.tip b{display:block;margin-bottom:2px}

/* forms */
form.f,.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;height:42px;width:100%;min-width:0}
textarea{height:auto;min-height:110px;resize:vertical;line-height:1.4}
label.wide{grid-column:1 / -1}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;align-items:center;gap:6px;color:var(--fg);font-size:14px}
.checks input{width:18px;height:18px;padding:0;flex:none}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--fg);padding:18px;width:min(600px, calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(30,25,20,.45)}
dialog > div, dialog > form{display:grid;gap:12px}
.err{color:var(--alert);font-weight:700}
.err:empty{display:none}
.url{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:12px;word-break:break-all;background:var(--bg);border-radius:8px;padding:6px 8px;flex:1 1 220px;min-width:0}
.stars{color:var(--bell);letter-spacing:1px;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:40;max-width:calc(100vw - 32px)}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">Villa Manager<small>Liku Loka</small></div>
    <label>Villa yang ditampilkan<select id="villa-pick" aria-label="Pilih villa"></select></label>
    <nav class="menu" id="menu" aria-label="Menu"></nav>
    <div class="foot"><a href="/tim/">Halaman tim (karyawan)</a><a href="/">← Kantor</a></div>
  </aside>
  <div id="scrim" hidden></div>
  <main class="main">
    <div class="topbar">
      <div class="left"><button id="burger" aria-label="Buka menu">☰</button><div><h1 id="title"></h1><p class="muted small" id="subtitle"></p></div></div>
      <div class="monthnav" id="monthnav">
        <button id="prev" aria-label="Bulan sebelumnya">‹</button><b id="month-label"></b><button id="next" aria-label="Bulan berikutnya">›</button>
        <button id="today-btn">Hari ini</button>
      </div>
    </div>
    <div id="view" style="display:flex;flex-direction:column;gap:16px;min-width:0"></div>
  </main>
</div>
<dialog id="dlg"><div id="dlg-body"></div></dialog>
<div id="toast" hidden role="status"></div>
<script src="/villa-app.js"></script>
</body>
</html>
