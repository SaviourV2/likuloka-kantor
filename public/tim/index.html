<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tim Villa</title>
<style>
/* Staff page (/tim): today's work for the signed-in staff member, made for a phone. No money except the SOP
   replacement prices of damaged or lost items. */
:root{--bg:#EFE8DC;--panel:#F8F4EC;--card:#FFFFFF;--line:#DDD2C1;--fg:#2E2B28;--muted:#675E55;--alert:#C2502E;--ok:#5F8048;--bell:#A87A12;--sky:#5B86A8;--ink:#2E2B28}
@media (prefers-color-scheme: dark){:root{--bg:#1F1C19;--panel:#26221E;--card:#2E2924;--line:#40392F;--fg:#F1EADF;--muted:#B8AC9C;--alert:#E2704C;--ok:#9DB88A;--bell:#E0B04A;--sky:#8FB4D2;--ink:#F1EADF;color-scheme:dark}}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:720px;margin-inline:auto;padding:18px 16px 60px;display:grid;gap:14px}
h1{margin:0;font-size:22px} h2{margin:0;font-size:17px} h3{margin:0;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
p{margin:0}.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.card.done{border-color:var(--ok)} .card.todo{border-left:5px solid var(--bell)} .card.late{border-left:5px solid var(--alert)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--fg)}
.tag.bad{border-color:var(--alert);background:color-mix(in srgb,var(--alert) 14%,var(--card));color:var(--fg)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 14px;min-height:46px;cursor:pointer}
button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
button:disabled{opacity:.55}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
label.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
label.check input{width:22px;height:22px;flex:none;margin-top:1px}
input[type=text],input[type=number],select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-height:44px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 120px 64px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.item small{display:block;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--fg);padding:16px;width:min(620px,calc(100vw - 20px));max-height:calc(100dvh - 20px)}
dialog::backdrop{background:rgba(30,25,20,.45)}
#body{display:grid;gap:12px}
.err{color:var(--alert);font-weight:700;min-height:1.2em}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:9;max-width:calc(100vw - 32px)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="hello">Tim Villa</h1><p class="muted" id="sub"></p></header>
  <div id="view" style="display:grid;gap:14px"></div>
</div>
<dialog id="dlg"><div id="body"></div></dialog>
<div id="toast" hidden role="status"></div>
<script>
const $ = id => document.getElementById(id);
function h(tag, props, ...kids) { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) { if (v == null || v === false) continue; if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else if (k === 'style') e.style.cssText = v; else if (k in e) e[k] = v; else e.setAttribute(k, v); }
  e.append(...kids.flat().filter(x => x != null && x !== false)); return e; }
const rp = n => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
const dfmt = d => new Date(d + 'T00:00:00Z').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
const tfmt = t => new Date(t).toLocaleString('id-ID', { timeZone: 'Asia/Makassar', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const addD = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const ROLE = { housekeeping: 'Housekeeping', maintenance: 'Maintenance', manajer: 'Manajer villa' };
let D = null;
const vname = id => D.villas.find(v => v.id === id)?.name || 'Villa';
const op = (type, ref) => D.ops.find(o => o.type === type && o.ref === ref);
const when = d => d === D.today ? 'Hari ini' : d === addD(D.today, 1) ? 'Besok' : d === addD(D.today, -1) ? 'Kemarin' : dfmt(d);
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2800); }
async function load() {
  const r = await fetch('/tim/api', { headers: { accept: 'application/json' }, cache: 'no-store' });
  if (!r.ok) { $('view').replaceChildren(h('div', { class: 'card' }, h('p', {}, r.status === 401 ? 'Email ini belum didaftarkan sebagai tim villa. Minta Kevin menambahkannya.' : 'Gagal memuat. Coba muat ulang halaman.'))); return; }
  D = await r.json(); render();
}
async function send(payload, err) {
  err.textContent = '';
  const r = await fetch('/tim/api', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) }), j = await r.json().catch(() => ({}));
  if (!r.ok) { err.textContent = j.error || 'Gagal menyimpan'; return null; }
  $('dlg').close(); await load(); return j;
}
const steps = list => list.map(s => h('label', { class: 'check' }, h('input', { type: 'checkbox', value: s }), h('span', {}, s)));
const ticked = box => [...box.querySelectorAll('label.check input:checked')].map(c => c.value);
function open(...kids) { $('body').replaceChildren(...kids.flat().filter(Boolean)); $('dlg').showModal(); }
const cancel = () => h('button', { type: 'button', onclick: () => $('dlg').close() }, 'Batal');

function openReady(s) {
  const box = h('div', {}, steps(D.sop.ready)), note = h('input', { type: 'text', placeholder: 'Catatan (boleh kosong)', maxLength: 300 }), err = h('div', { class: 'err' });
  open(h('h2', {}, 'Siapkan ' + vname(s.villa_id)), h('p', { class: 'muted' }, `${s.guest}${s.guests ? ', ' + s.guests + ' tamu' : ''} · check-in ${when(s.check_in).toLowerCase()} 14:00`), box, note, err,
    h('div', { class: 'row' }, cancel(), h('button', { class: 'pri', onclick: async () => { if (await send({ action: 'ready', ref: s.ref, steps: ticked(box), note: note.value }, err)) toast('Villa ditandai siap'); } }, 'Villa siap')));
}
function openCheckout(s) {
  const box = h('div', {}, steps(D.sop.checkout)), note = h('input', { type: 'text', placeholder: 'Catatan (boleh kosong)', maxLength: 300 }), err = h('div', { class: 'err' }), total = h('b', {}, rp(0));
  const items = D.items.filter(i => !i.villa_id || i.villa_id === s.villa_id);
  const rows = items.map(i => { const state = h('select', { 'aria-label': 'Kondisi ' + i.name, onchange: sumUp }, h('option', { value: '' }, 'Baik'), h('option', { value: 'rusak' }, 'Rusak'), h('option', { value: 'hilang' }, 'Hilang')), qty = h('input', { type: 'number', min: 1, max: 99, value: 1, 'aria-label': 'Jumlah ' + i.name, oninput: sumUp });
    return { i, state, qty, el: h('div', { class: 'item' }, h('div', {}, i.name, h('small', {}, 'ganti ' + rp(i.charge))), state, qty) }; });
  function sumUp() { total.textContent = rp(rows.reduce((n, r) => n + (r.state.value ? r.i.charge * Math.max(1, +r.qty.value || 1) : 0), 0)); }
  open(h('h2', {}, 'Pemeriksaan checkout ' + vname(s.villa_id)), h('p', { class: 'muted' }, `${s.guest} · check-out ${when(s.check_out).toLowerCase()} 11:00`),
    h('h3', {}, 'Langkah SOP'), box, h('h3', {}, 'Periksa barang satu per satu'),
    items.length ? h('div', {}, rows.map(r => r.el)) : h('p', { class: 'muted' }, 'Daftar barang SOP belum diisi Kevin.'),
    h('div', { class: 'row' }, h('span', {}, 'Ditagihkan ke tamu sesuai SOP'), total), note, err,
    h('div', { class: 'row' }, cancel(), h('button', { class: 'pri', onclick: async () => { const issues = rows.filter(r => r.state.value).map(r => ({ item_id: r.i.id, kind: r.state.value, qty: +r.qty.value || 1 }));
      const j = await send({ action: 'checkout', ref: s.ref, steps: ticked(box), issues, note: note.value }, err); if (j) toast(issues.length ? `Tercatat ${issues.length} temuan, ${rp(j.total)}` : 'Tercatat: semua barang lengkap'); } }, 'Simpan pemeriksaan')));
}
function openIssue() {
  const v = h('select', {}, D.villas.map(x => h('option', { value: x.id }, x.name))), text = h('textarea', { placeholder: 'Contoh: AC kamar 2 menetes, lampu taman mati', maxLength: 300 }), err = h('div', { class: 'err' });
  open(h('h2', {}, 'Lapor masalah'), v, text, err, h('div', { class: 'row' }, cancel(), h('button', { class: 'pri', onclick: async () => { if (await send({ action: 'issue', villa_id: v.value, text: text.value }, err)) toast('Laporan terkirim'); } }, 'Kirim laporan')));
}
function render() {
  const can = a => D.can.includes(a), t = D.today, out = [];
  $('hello').textContent = 'Halo, ' + D.me.name; $('sub').textContent = `${ROLE[D.me.role] || ''} · ${dfmt(t)} · ${D.villas.map(v => v.name).join(', ') || 'belum ada villa'}`;
  const who = s => `${s.guest}${s.guests ? ' · ' + s.guests + ' tamu' : ''}`;
  if (can('checkout')) {
    const list = D.stays.filter(s => s.check_out <= t && s.check_out >= addD(t, -2)).sort((a, b) => a.check_out.localeCompare(b.check_out));
    out.push(h('h2', {}, 'Checkout: periksa barang'), ...(list.length ? list.map(s => { const o = op('checkout', s.ref), n = o?.data?.found?.length || 0;
      return h('div', { class: 'card ' + (o ? 'done' : s.check_out < t ? 'late' : 'todo') }, h('div', { class: 'row' }, h('b', {}, vname(s.villa_id)), o ? h('span', { class: 'tag ' + (n ? 'bad' : 'good') }, n ? n + ' temuan' : 'Lengkap') : h('span', { class: 'tag bad' }, 'Belum diperiksa')),
        h('p', {}, `${who(s)} · keluar ${when(s.check_out).toLowerCase()} 11:00`), o ? h('p', { class: 'muted small' }, `Diperiksa ${o.by_name}, ${tfmt(o.at)}`) : h('p', { class: 'small' }, 'Periksa semua barang sebelum tamu pergi. Kerusakan atau kehilangan ditagihkan ke tamu sesuai SOP.'),
        h('button', { class: o ? '' : 'pri', onclick: () => openCheckout(s) }, o ? 'Periksa ulang' : 'Mulai pemeriksaan')); }) : [h('p', { class: 'muted' }, 'Tidak ada checkout hari ini.')]));
  }
  if (can('ready')) {
    const list = D.stays.filter(s => s.check_in >= t && s.check_in <= addD(t, 3)).sort((a, b) => a.check_in.localeCompare(b.check_in));
    out.push(h('h2', {}, 'Check-in: siapkan villa'), ...(list.length ? list.map(s => { const o = op('ready', s.ref);
      return h('div', { class: 'card ' + (o ? 'done' : 'todo') }, h('div', { class: 'row' }, h('b', {}, vname(s.villa_id)), o ? h('span', { class: 'tag good' }, 'Siap') : h('span', { class: 'tag' }, 'Belum siap')),
        h('p', {}, `${who(s)} · masuk ${when(s.check_in).toLowerCase()} 14:00, sampai ${dfmt(s.check_out)}`), o ? h('p', { class: 'muted small' }, `Ditandai siap oleh ${o.by_name}, ${tfmt(o.at)}`) : null,
        o ? null : h('button', { class: 'pri', onclick: () => openReady(s) }, 'Tandai villa siap')); }) : [h('p', { class: 'muted' }, 'Tidak ada check-in dalam 3 hari ini.')]));
    const inhouse = D.stays.filter(s => s.check_in < t && s.check_out > t);
    if (inhouse.length) out.push(h('h2', {}, 'Sedang menginap'), h('div', { class: 'card' }, inhouse.map(s => h('p', {}, h('b', {}, vname(s.villa_id)), ` · ${who(s)} · sampai ${dfmt(s.check_out)}`))));
  }
  if (can('maintenance')) {
    const list = D.blocks.filter(b => b.kind === 'maintenance' && b.end_date > addD(t, -1));
    out.push(h('h2', {}, 'Jadwal maintenance'), ...(list.length ? list.map(b => { const o = op('maintenance', b.ref), err = h('div', { class: 'err' });
      return h('div', { class: 'card ' + (o ? 'done' : 'todo') }, h('div', { class: 'row' }, h('b', {}, vname(b.villa_id)), o ? h('span', { class: 'tag good' }, 'Selesai') : h('span', { class: 'tag' }, 'Belum selesai')),
        h('p', {}, `${dfmt(b.start_date)} sampai ${dfmt(addD(b.end_date, -1))}${b.note ? ' · ' + b.note : ''}`), o ? h('p', { class: 'muted small' }, `Selesai oleh ${o.by_name}, ${tfmt(o.at)}`) : h('button', { class: 'pri', onclick: async () => { if (await send({ action: 'maintenance', ref: b.ref }, err)) toast('Maintenance selesai'); } }, 'Tandai selesai'), err); }) : [h('p', { class: 'muted' }, 'Tidak ada jadwal maintenance.')]));
  }
  const others = D.blocks.filter(b => b.kind !== 'maintenance' && b.start_date <= addD(t, 7) && b.end_date > t);
  if (others.length) out.push(h('h2', {}, 'Villa dipakai / acara'), h('div', { class: 'card' }, others.map(b => h('p', {}, h('b', {}, vname(b.villa_id)), ` · ${b.label} · ${dfmt(b.start_date)} sampai ${dfmt(addD(b.end_date, -1))}${b.note ? ' · ' + b.note : ''}`))));
  const issues = D.ops.filter(o => o.type === 'issue' && o.status === 'open');
  out.push(h('div', { class: 'row' }, h('h2', {}, 'Laporan masalah'), can('issue') ? h('button', { onclick: openIssue }, '+ Lapor masalah') : null), ...(issues.length ? issues.map(o => { const err = h('div', { class: 'err' });
    return h('div', { class: 'card todo' }, h('p', {}, h('b', {}, vname(o.villa_id)), ' · ' + o.text), h('p', { class: 'muted small' }, `${o.by_name}, ${tfmt(o.at)}`),
      can('issue_done') ? h('button', { onclick: async () => { if (await send({ action: 'issue_done', id: o.id }, err)) toast('Ditandai selesai'); } }, 'Sudah diperbaiki') : null, err); }) : [h('p', { class: 'muted' }, 'Tidak ada masalah yang terbuka.')]));
  $('view').replaceChildren(...out.filter(Boolean));
}
$('dlg').onclick = ev => { if (ev.target === $('dlg')) $('dlg').close(); };
load();
</script>
</body>
</html>
